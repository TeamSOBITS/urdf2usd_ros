files_path:
  urdf: /ABSOLUTE/PATH/TO/INPUT/URDF/FILE.urdf
  usd: /ABSOLUTE/PATH/TO/OUTPUT/USD/FILE.usd

# Every package:// the URDF uses (meshes, textures) must be listed here or discoverable through
# ament_index / AMENT_PREFIX_PATH / COLCON_PREFIX_PATH / ROS_PACKAGE_PATH; missing ones abort the import
ros_package_paths: {}
# my_description: /ABSOLUTE/PATH/TO/my_description

# Import options
import:
  # Re-parent fixed joints whose parent link has no inertia, so the child stays in the same articulation
  fix_massless_parents: true
  # allow_missing_meshes: false # true = only warn when a package:// mesh cannot be found
  # expected_articulation_roots: 1 # only used by tests/convert_and_check.py

# Drive gains are SI: N.m/rad and N.m.s/rad (revolute), N/m and N.s/m (prismatic).
# They are converted to USD's per-degree angular gains when written.
default_drive:
  # auto (recommended): per joint k = max(I_max (2 pi f)^2, tau_g_max / e_max), d = 2 zeta sqrt(k I_max),
  # from the URDF subtree inertia, so light wrist/finger joints get far softer gains than the shoulder.
  mode: auto
  natural_frequency: 10.0 # Hz, bandwidth every joint is tuned for
  damping_ratio: 1.0
  max_sag_deg: 0.5 # allowed gravity sag, revolute
  max_sag_m: 0.002 # allowed gravity sag, prismatic
  velocity_damping: 10.0 # damping of velocity-driven joints (stiffness 0.0) without an explicit damping

  # manual: the same gains for every joint (omit "mode", or use mode: manual)
  # stiffness: 10000.0
  # damping: 100.0

# Per-joint overrides (SI) always win over the default
joints:
  # WHEELS: stiffness 0.0 = Velocity Control (damping falls back to velocity_damping if omitted)
  wheel_left_joint:
    stiffness: 0.0
    damping: 10.0
  wheel_right_joint:
    stiffness: 0.0
    damping: 10.0

  # Example of a manual override for one position-controlled joint
  # arm_joint_1:
  #   stiffness: 800.0
  #   damping: 50.0

# Sensor Configuration ("camera", "lidar", "imu" supported)
sensors:
  # RGB-D Camera (Single prim handles RGB, Depth, PointCloud)
  camera:
    type: "camera"
    parent_link: "camera_link"
    horizontal_aperture: 20.955
    vertical_aperture: 15.2908
    focal_length: 1.93
    clipping_range: [0.01, 100.0]
    rotation: [180, 0, 0]
    visible: false
    rgb:
      enabled: true
      enable_semantic_labels: false
      frame_skip: 0
      reset_sim_time_on_stop: false
      topic: "camera/color"
    depth:
      enabled: true
      enable_semantic_labels: false
      frame_skip: 0
      reset_sim_time_on_stop: false
      topic: "camera/depth"
    pcl:
      enabled: true
      enable_semantic_labels: false
      frame_skip: 0
      reset_sim_time_on_stop: false
      topic: "camera/depth/points"
  
  # 2D/3D Lidar
  lidar:
    type: "lidar"
    parent_link: "laser_frame"
    implementation: "physx" # Options: 'physx' or 'rtx'
    profile: "Example_Rotary" # For RTX Lidar: "Example_Rotary", "Generic", "Ouster_OS1_128"
    min_range: 0.1
    max_range: 10.0
    horizontal_fov: 360.0
    horizontal_resolution: 0.01 # Degrees between points
    vertical_fov: 1.0 # Set >1.0 for 3D Lidar
    vertical_resolution: 1.0 # Set <1.0 for 3D Lidar
    rotation_rate: 20.0 # Hz
    draw_points: false
    draw_lines: false
    high_lod: false # Use high level of detail for visualization (3D Lidar only)
    topic: "lidar/scan"

  # IMU
  imu_sensor:
    type: "imu"
    parent_link: "imu_link"
    read_gravity: true
    use_latest_data: false
    publish_angular_velocity: true
    publish_linear_acceleration: true
    publish_orientation: true
    update_rate: 10.0 # Hz
    topic: "imu"


ros2:
  enabled: true
  domain_id: 0 # ROS_DOMAIN_ID
  namespace: ""

  # GLOBAL PUBLISHERS
  publish_tf: true
  publish_joint_states: true
  topic_joint_states: "joint_states"

  # MOBILE BASE (Navigation)
  mobile_base:
    enabled: true
    topic_cmd_vel: "cmd_vel"
    topic_odom: "odom"
    frame_odom: "odom"
    frame_base: "base_footprint"
    wheel_joints: ["wheel_left_joint", "wheel_right_joint"]
    wheel_radius: 0.045
    wheel_base: 0.20 # Distance between wheels

  # JOINT CONTROLLERS
  controllers:
    arm_controller:
      topic: "arm_position_controller"
      type: "position" # 'position' or 'velocity'
      joints: 
        - "arm_joint_1"
        - "arm_joint_2"
        - "arm_joint_3"
    hand_controller:
      topic: "hand_position_controller"
      type: "position"
      joints:
        - "hand_joint"
