# OPTIONAL robot descriptor (<robot>.robot.yaml, see sobits_robot_descriptor): with it, ros2.namespace,
# ros2.topic_joint_states, ros2.controllers, files_path.urdf and each sensor's type/parent_link/frame_id/topics/
# image size/rate are filled from it (explicit values below win). `sensors` is then keyed by descriptor sensor
# names and holds only the Isaac-only parameters (apertures, clipping, rotation, lidar profile, IMU flags),
# see config/sobit_home.yaml. Without this key the legacy, fully explicit form below is used.
# robot_descriptor: my_robot   # id, or path to a .robot.yaml

files_path:
  urdf: /ABSOLUTE/PATH/TO/INPUT/URDF/FILE.urdf
  usd: /ABSOLUTE/PATH/TO/OUTPUT/USD/FILE.usd

# Every package:// the URDF uses (meshes, textures) must be listed here or discoverable through
# ament_index / AMENT_PREFIX_PATH / COLCON_PREFIX_PATH / ROS_PACKAGE_PATH; missing ones abort the import
ros_package_paths: {}
# my_description: /ABSOLUTE/PATH/TO/my_description

# Import options
import:
  # Re-parent fixed joints whose parent link has no inertia, so the child stays in the same articulation
  fix_massless_parents: true
  # allow_missing_meshes: false # true = only warn when a package:// mesh cannot be found
  # expected_articulation_roots: 1 # only used by tests/convert_and_check.py

# Drive gains are SI: N.m/rad and N.m.s/rad (revolute), N/m and N.s/m (prismatic).
# They are converted to USD's per-degree angular gains when written.
default_drive:
  # auto (recommended): per joint k = max(I_max (2 pi f)^2, tau_g_max / e_max), d = 2 zeta sqrt(k I_max),
  # from the URDF subtree inertia, so light wrist/finger joints get far softer gains than the shoulder.
  mode: auto
  natural_frequency: 10.0 # Hz, bandwidth every joint is tuned for
  damping_ratio: 1.0
  max_sag_deg: 0.5 # allowed gravity sag, revolute
  max_sag_m: 0.002 # allowed gravity sag, prismatic
  velocity_damping: 10.0 # damping of velocity-driven joints (stiffness 0.0) without an explicit damping

  # manual: the same gains for every joint (omit "mode", or use mode: manual)
  # stiffness: 10000.0
  # damping: 100.0

# Per-joint overrides (SI) always win over the default
joints:
  # WHEELS: stiffness 0.0 = Velocity Control (damping falls back to velocity_damping if omitted)
  wheel_left_joint:
    stiffness: 0.0
    damping: 10.0
  wheel_right_joint:
    stiffness: 0.0
    damping: 10.0

  # Example of a manual override for one position-controlled joint
  # arm_joint_1:
  #   stiffness: 800.0
  #   damping: 50.0

# Initial pose (SI: rad / m), optional: overrides/extends the <ros2_control> initial_value entries of the URDF
# initial_pose:
#   arm_shoulder_pitch_joint: -1.5707963

# Sensor Configuration ("camera", "lidar", "imu" supported)
sensors:
  # RGB-D Camera (Single prim handles RGB, Depth, PointCloud)
  camera:
    type: "camera"
    parent_link: "camera_link"
    horizontal_aperture: 20.955
    vertical_aperture: 15.2908
    focal_length: 1.93
    clipping_range: [0.01, 100.0]
    rotation: [180, 0, 0]
    visible: false
    rgb:
      enabled: true
      enable_semantic_labels: false
      frame_skip: 0
      # reset_sim_time_on_stop: false # default: ros2.reset_sim_time_on_stop
      topic: "camera/color"
      # frame_id: "camera_color_optical_frame" # default: the sensor frame_id
      # info_topic: "camera/color/camera_info" # default: <sensor>/camera_info
      # compressed: false # true = also publish sensor_msgs/CompressedImage (GPU encoder)
      # compressed_codec: "h264" # h264 or hevc
      # compressed_topic: "camera/color/compressed" # default: <topic>/compressed
    depth:
      enabled: true
      enable_semantic_labels: false
      frame_skip: 0
      # reset_sim_time_on_stop: false # default: ros2.reset_sim_time_on_stop
      topic: "camera/depth"
      # frame_id: "camera_depth_optical_frame" # default: the sensor frame_id
      # info_topic: "camera/depth/camera_info" # default: <sensor>/depth/camera_info
    pcl:
      enabled: true
      enable_semantic_labels: false
      frame_skip: 0
      # reset_sim_time_on_stop: false # default: ros2.reset_sim_time_on_stop
      topic: "camera/depth/points"
  
  # 2D/3D Lidar
  lidar:
    type: "lidar"
    parent_link: "laser_frame"
    implementation: "physx" # Options: 'physx' or 'rtx'
    profile: "Example_Rotary" # For RTX Lidar: "Example_Rotary", "Generic", "Ouster_OS1_128"
    min_range: 0.1
    max_range: 10.0
    horizontal_fov: 360.0
    horizontal_resolution: 0.01 # Degrees between points
    vertical_fov: 1.0 # Set >1.0 for 3D Lidar
    vertical_resolution: 1.0 # Set <1.0 for 3D Lidar
    rotation_rate: 20.0 # Hz
    draw_points: false
    draw_lines: false
    high_lod: false # Use high level of detail for visualization (3D Lidar only)
    topic: "lidar/scan"

  # IMU
  imu_sensor:
    type: "imu"
    parent_link: "imu_link"
    read_gravity: true
    use_latest_data: false
    publish_angular_velocity: true
    publish_linear_acceleration: true
    publish_orientation: true
    update_rate: 10.0 # Hz
    topic: "imu"


ros2:
  enabled: true
  domain_id: 0 # ROS_DOMAIN_ID
  namespace: ""
  reset_sim_time_on_stop: false # SimTime/camera/lidar resetOnStop; keep false (monotonic time)

  # GLOBAL PUBLISHERS
  publish_tf: true
  publish_joint_states: true
  topic_joint_states: "joint_states"

  # MOBILE BASE (Navigation)
  mobile_base:
    enabled: true
    topic_cmd_vel: "cmd_vel"
    topic_odom: "odom"
    frame_odom: "odom"
    frame_base: "base_footprint"
    wheel_joints: ["wheel_left_joint", "wheel_right_joint"]
    wheel_radius: 0.045
    wheel_base: 0.20 # Distance between wheels

  # ROS2_CONTROL (Isaac 6.1+, needs robot_descriptor): an in-process controller_manager hosts the
  # joint_state_broadcaster and one controller per descriptor group; it replaces the joint-state,
  # joint-controller and (diff_drive) mobile base graphs below. See README "ros2_control".
  control:
    enabled: true # default: true when the isaacsim.ros2.control.ROS2ControlManager node exists
    # update_rate: 100 # controller_manager Hz
    # diff_drive: true # false = keep a diff_drive base on the ROS2_MobileBase graph
    # config_path: /ABSOLUTE/PATH/robot_ros2_control.yaml # default: <usd dir>/<usd stem>_ros2_control.yaml
    # controllers: # deep-merged into the generated YAML; `type` sets/adds a plugin
    #   controller_manager: {update_rate: 200}
    #   arm_position_controller: {constraints: {goal_time: 0.5}}
    #   wheel_controller: {linear.x.max_velocity: 0.5}

  # JOINT CONTROLLERS
  controllers:
    arm_controller:
      topic: "arm_position_controller"
      type: "position" # 'position' or 'velocity'
      joints: 
        - "arm_joint_1"
        - "arm_joint_2"
        - "arm_joint_3"
    hand_controller:
      topic: "hand_position_controller"
      type: "position"
      joints:
        - "hand_joint"
