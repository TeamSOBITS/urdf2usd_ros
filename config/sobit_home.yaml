# Robot facts (namespace, topics, frames, controllers, sensor streams) come from the descriptor
robot_descriptor: sobit_home

files_path:
  # urdf left as a placeholder: resolved from the descriptor (<sobit_home_description share>/robots/...)
  urdf: /ABSOLUTE/PATH/TO/INPUT/URDF/FILE/sobit_home_robot.urdf
  usd: /ABSOLUTE/PATH/TO/OUTPUT/USD/FILE/sobit_home.usd

# Every package:// the URDF uses must be listed here or discoverable (ament_index / AMENT_PREFIX_PATH)
ros_package_paths:
  sobit_home_description: /ABSOLUTE/PATH/TO/sobit_home_description
  urg_node: /ABSOLUTE/PATH/TO/urg_node
  orbbec_description: /ABSOLUTE/PATH/TO/orbbec_description

# Drive gains are SI (N.m/rad, N.m.s/rad; N/m, N.s/m for prismatic); converted to USD per-degree on write
default_drive:
  mode: auto # gains from URDF inertia, see README "Joint drive gains"
  natural_frequency: 10.0 # Hz
  damping_ratio: 1.0
  max_sag_deg: 0.5
  max_sag_m: 0.002
  velocity_damping: 10.0

joints:
  # Wheel velocity joints: stiffness 0.0 = velocity control
  wheel_drive_f_l_joint:
    stiffness: 0.0
    damping: 10.0
  wheel_drive_f_r_joint:
    stiffness: 0.0
    damping: 10.0
  wheel_drive_b_l_joint:
    stiffness: 0.0
    damping: 10.0
  wheel_drive_b_r_joint:
    stiffness: 0.0
    damping: 10.0
  # Steer joints: the inertia auto gain (~114 N.m/rad) cannot pivot a loaded wheel out of the swerve
  # controller's idle park; 2865 / 286 (50 / 5 per degree in USD) was verified driving in Isaac 6.1
  wheel_steer_f_l_joint:
    stiffness: 2865.0
    damping: 286.5
  wheel_steer_f_r_joint:
    stiffness: 2865.0
    damping: 286.5
  wheel_steer_b_l_joint:
    stiffness: 2865.0
    damping: 286.5
  wheel_steer_b_r_joint:
    stiffness: 2865.0
    damping: 286.5

# Isaac-only parameters, keyed by descriptor sensor names; frames/topics/size/rate are filled from the descriptor
sensors:
  head_camera:
    horizontal_aperture: 20.955
    vertical_aperture: 11.78
    focal_length: 15.0
    clipping_range: [0.1, 20.0]
    rotation: [180, 0, 0]
    visible: false

  # Calibrated 640x480 mode, HFOV 106.1 deg (sobit_home hand-cam-sim-parity): f = 20.955 / (2 tan(53.05 deg))
  hand_left_camera:
    horizontal_aperture: 20.955
    vertical_aperture: 15.716
    focal_length: 7.881
    clipping_range: [0.01, 20.0]
    rotation: [180, 0, 0]
    visible: false

  hand_right_camera:
    horizontal_aperture: 20.955
    vertical_aperture: 15.716
    focal_length: 7.881
    clipping_range: [0.01, 20.0]
    rotation: [180, 0, 0]
    visible: false

  # Two UST lidars like the real robot; the ROS side merges them into lidar_scan (merge_2_scan.launch.py)
  lidar_front:
    implementation: "rtx"
    profile: "Example_Rotary_2D"
    # MJCF rangefinder fan (mujoco_ros2_control RangefinderLidarPlugin); defaults shown
    # mujoco: {angle_min: -2.25, angle_max: 2.25, angle_increment: 0.00872665, range_min: 0.02, range_max: 30.0}

  lidar_back:
    implementation: "rtx"
    profile: "Example_Rotary_2D"
    # MJCF rangefinder fan (mujoco_ros2_control RangefinderLidarPlugin); defaults shown
    # mujoco: {angle_min: -2.25, angle_max: 2.25, angle_increment: 0.00872665, range_min: 0.02, range_max: 30.0}

ros2:
  enabled: true
  domain_id: 0
  use_domain_id_env: true # every ROS2Context follows the Isaac process' ROS_DOMAIN_ID (same as its controller_manager)
  publish_tf: true
  publish_joint_states: true

  # In-process ros2_control: the wheel steer/drive groups map to JointGroupPosition/VelocityController
  # (scripts/fetch_ros2_controllers.py installs those plugins)
  control:
    enabled: true

  # Swerve base: the DifferentialController graph does not apply (TODO swerve)
  mobile_base:
    enabled: false
