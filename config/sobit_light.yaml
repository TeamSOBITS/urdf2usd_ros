# Robot facts (namespace, topics, frames, controllers, sensor streams) come from the descriptor
robot_descriptor: sobit_light

files_path:
  # urdf left as a placeholder: resolved from the descriptor (<sobit_light_description share>/robots/...)
  urdf: /ABSOLUTE/PATH/TO/INPUT/URDF/FILE/sobit_light_robot.urdf
  usd: /ABSOLUTE/PATH/TO/OUTPUT/USD/FILE/sobit_light.usd

# Every package:// the URDF uses must be listed here or discoverable (ament_index / AMENT_PREFIX_PATH)
ros_package_paths:
  sobit_light_description: /ABSOLUTE/PATH/TO/sobit_light_description
  kachaka_description: /ABSOLUTE/PATH/TO/kachaka_description
  realsense2_description: /ABSOLUTE/PATH/TO/realsense2_description

# Drive gains are SI (N.m/rad, N.m.s/rad; N/m, N.s/m for prismatic); converted to USD per-degree on write
default_drive:
  mode: auto # gains from URDF inertia, see README "Joint drive gains"
  natural_frequency: 10.0 # Hz
  damping_ratio: 1.0
  max_sag_deg: 0.5
  max_sag_m: 0.002
  velocity_damping: 10.0

joints:
  # Kachaka wheel velocity joints: stiffness 0.0 = velocity control
  base_l_drive_wheel_joint:
    stiffness: 0.0
    damping: 10.0
  base_r_drive_wheel_joint:
    stiffness: 0.0
    damping: 10.0

# Isaac-only parameters, keyed by descriptor sensor names; frames/topics/size/rate are filled from the descriptor
# Camera focal_length = 20.955 / (2 tan(HFOV/2)); vertical_aperture = 20.955 * height / width
sensors:
  # RealSense D435 colour, 1280x720, HFOV 69.4 deg (gz horizontal_fov 1.21126, gazebo.urdf.xacro)
  head_camera:
    horizontal_aperture: 20.955
    vertical_aperture: 11.787
    focal_length: 15.131
    clipping_range: [0.1, 20.0]
    rotation: [180, 0, 0]
    visible: false

  # RealSense D405, 640x480, HFOV 87 deg (datasheet; the gz sensor uses 69.4 deg)
  hand_camera:
    horizontal_aperture: 20.955
    vertical_aperture: 15.716
    focal_length: 11.041
    clipping_range: [0.1, 20.0]
    rotation: [180, 0, 0]
    visible: false

  # Kachaka base cameras, 640x480, HFOV 69.4 deg (gz horizontal_fov 1.21126, gazebo.urdf.xacro camera_front_link/camera_back_link)
  camera_front:
    horizontal_aperture: 20.955
    vertical_aperture: 15.716
    focal_length: 15.131
    clipping_range: [0.1, 20.0]
    rotation: [180, 0, 0]
    visible: false

  camera_rear:
    horizontal_aperture: 20.955
    vertical_aperture: 15.716
    focal_length: 15.131
    clipping_range: [0.1, 20.0]
    rotation: [180, 0, 0]
    visible: false

  lidar:
    implementation: "rtx"
    profile: "Example_Rotary_2D"

  imu:
    read_gravity: true
    use_latest_data: false
    publish_angular_velocity: true
    publish_linear_acceleration: true
    publish_orientation: true
    update_rate: 100.0 # Hz

ros2:
  enabled: true
  domain_id: 0
  publish_tf: true
  publish_joint_states: true
